<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&family=Libre+Franklin:wght@400..800&display=swap" rel="stylesheet" />
    <title>Apuração 2026: resultados das eleições ao vivo</title>
    <!-- Por rota, o servidor (server/seo.mjs) troca o título, o bloco seo abaixo e o resumo no #root; no vite dev ficam assim. -->
    <!--seo-->
    <meta name="description" content="Apuração das Eleições 2026 com dados oficiais do TSE: presidente, governador, senador e deputados, com mapa por estado, município e zona eleitoral." />
    <!--/seo-->
    <script>
      // Aplica o tema escolhido antes da primeira pintura (sem escolha salva, segue o sistema).
      try {
        var tema = localStorage.getItem('tema');
        if (tema === 'claro' || tema === 'escuro') document.documentElement.dataset.tema = tema;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--seo:conteudo--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
