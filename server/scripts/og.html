<!doctype html>
<!-- Imagem de compartilhamento (public/og.png, 1200×630): `npm run og` renderiza esta página no Chromium headless. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #111110; color: #ede8dd; padding: 56px 64px;
    display: flex; flex-direction: column; font-family: 'IBM Plex Mono', monospace;
  }
  .rotulo { font-size: 22px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9a948a; }
  .status { display: flex; align-items: center; gap: 12px; color: #f2a33a; }
  .status i { width: 14px; height: 14px; background: #f2a33a; }
  .topo { display: flex; justify-content: space-between; align-items: center; padding-bottom: 22px; border-bottom: 1px solid #3a3833; }
  .marca { display: flex; align-items: center; gap: 28px; margin-top: 80px; }
  .marca svg { width: 112px; height: 112px; flex: none; }
  h1 {
    font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 800; font-size: 150px; line-height: 0.82;
    letter-spacing: -0.01em; text-transform: uppercase;
  }
  .barra { position: relative; display: flex; height: 18px; margin-top: auto; background: #2e2c28; }
  .barra b { display: block; height: 100%; }
  .barra .marca50 { position: absolute; left: 50%; top: -8px; bottom: -8px; width: 3px; margin-left: -1.5px; background: #ede8dd; }
  .rodape { display: flex; justify-content: space-between; margin-top: 22px; }
  .rodape span:last-child { color: #ede8dd; }
</style>
</head>
<body>
  <div class="topo">
    <span class="rotulo">Eleições Gerais 2026 · 1º turno 4/10 · 2º turno 25/10</span>
    <span class="rotulo status"><i></i>Ao vivo</span>
  </div>
  <div class="marca">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" fill="#ede8dd" />
      <g fill="#111110">
        <rect x="7" y="7" width="18" height="3" />
        <rect x="7" y="19" width="4.5" height="6" />
        <rect x="13.75" y="15.5" width="4.5" height="9.5" />
        <rect x="20.5" y="12.5" width="4.5" height="12.5" />
      </g>
    </svg>
    <h1>Apuração.org</h1>
  </div>
  <div class="barra"><b style="width: 46%; background: #9a948a"></b><b style="width: 8%; background: #3a3833"></b><b style="width: 46%; background: #ede8dd"></b><span class="marca50"></span></div>
  <div class="rodape">
    <span class="rotulo">Resultados por estado, município e zona</span>
    <span class="rotulo">Dados oficiais do TSE</span>
  </div>
</body>
</html>
