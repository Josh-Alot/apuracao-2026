# Blueprint do Render: um Web Service (instância Starter) com o servidor Node (API + front buildado).
# O Render define a variável PORT; o server/index.mjs já a usa.
services:
  - type: web
    name: apuracao-2026
    runtime: node
    plan: starter # 512 MB e não dorme (o free dormia após 15 min, ruim para o Googlebot)
    region: virginia # região mais próxima do Brasil entre as disponíveis
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/saude # leve: não lê o TSE nem o HTML; e não sofre o 301 do SITE_URL
    autoDeployTrigger: commit # cada push na branch principal publica de novo
    envVars:
      - key: NODE_VERSION
        value: "24"
